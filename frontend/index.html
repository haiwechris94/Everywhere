<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/data/Everywhere_Logo_Mark_Black.png" />
    <!-- FIXED: Enhanced viewport meta to prevent unwanted zoom on mobile devices -->
    <!-- user-scalable=yes allows pinch zoom but prevents auto-zoom on input focus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <!-- Prevent iOS Safari from auto-zooming on input focus (font-size >= 16px handles this in CSS) -->
    <meta name="format-detection" content="telephone=no" />
    <title>Everywhere</title>
    <!-- Apply the saved theme synchronously before React paints to avoid a flash of light mode -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0c6a85" />
    <!-- Polices du design system : Lexend (titres) + Source Sans 3 (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
    />
    <!-- Preconnect to tile servers for faster map loading -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
